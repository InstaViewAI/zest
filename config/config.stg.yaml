env: stg

server:
  name: zest
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 30s
  shutdown_timeout: 5s

slack:
  base_url: https://slack.com/api
  token: "read from secret"
  timeout: 10s
  # TODO: the stg escalation channel id (C...), never a channel name.
  channel_id: ""
  bot_name: ZEST
  report_bot_name: ZEST - Weekly Report
  icon_url: https://partner-assets-worker.infra-dev.workers.dev/slackBot.png

zendesk:
  base_url: ""
  subdomain: instaviewhomesupport
  email: "read from secret"
  api_token: "read from secret"
  timeout: 10s
  webhook_secret: "read from secret"

escalation:
  tag: escalated
  # Numeric ids of the slack_thread_ts / slack_channel_id custom fields on the
  # instaviewhomesupport instance.
  thread_ts_field_id: 49183901058580
  channel_id_field_id: 49183905928852

report:
  stale_after: 168h
  timezone: Asia/Manila
  weekly_enabled: true
  weekly_cron: "30 1 * * 6"
  monthly_enabled: false
  monthly_cron: "30 1 1 * *"
